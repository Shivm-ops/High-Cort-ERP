version: "3.9"

# ─── Hostinger VPS Full-Stack Deployment ────────────────────────────────────
# Requirements: Ubuntu 22.04, Docker, Docker Compose, Certbot
# Run with:  docker compose -f docker-compose.vps.yml up -d --build
# Env vars:  set in /opt/fastcase/.env (loaded via env_file or shell export)

services:

  # ─── Marketing Website (yourdomain.com / www.yourdomain.com) ───────────────
  website:
    build:
      context: ./fastcase-website
      dockerfile: Dockerfile
      args:
        - VITE_ERP_APP_URL=https://app.fastcase.in
        - VITE_ADMIN_APP_URL=https://admin.fastcase.in
    restart: unless-stopped
    expose:
      - "80"

  # ─── ERP Frontend (app.yourdomain.com) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-fastcase.in}/api/v1
        - NEXT_PUBLIC_APP_NAME=Fastcase
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-fastcase.in}/api/v1
      - NEXT_PUBLIC_ROOT_DOMAIN=${DOMAIN:-fastcase.in}
      - NEXT_PUBLIC_APP_NAME=Fastcase
      - NODE_ENV=production
    depends_on:
      - backend
    expose:
      - "3000"

  # ─── Admin Frontend (admin.yourdomain.com) ──────────────────────────────────
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-fastcase.in}/api/v1
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-fastcase.in}/api/v1
      - NEXT_PUBLIC_ROOT_DOMAIN=${DOMAIN:-fastcase.in}
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - backend
    expose:
      - "3001"

  # ─── Backend API (api.yourdomain.com) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.production
      - path: ./backend/.env.secrets   # gitignored: Razorpay/SMTP keys, survives deploys
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://lagalos:${POSTGRES_PASSWORD}@postgres:5432/lagalos_db
      - REDIS_URL=redis://redis:6379/0
      - DOMAIN=${DOMAIN:-fastcase.in}
      - ROOT_DOMAIN=${DOMAIN:-fastcase.in}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-k1cT7yG-QxV8_W9zL1mN3oP5qR7sT9uV1wX3yZ5aB7c=}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips "*"

  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lagalos_db
      POSTGRES_USER: lagalos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagalos -d lagalos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Nginx Reverse Proxy (HTTP only — Certbot handles SSL on host) ───────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.vps.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - website
      - frontend
      - admin-frontend
      - backend

  # ─── Prometheus (Metrics Collection) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 150M
    expose:
      - "9090"
    depends_on:
      - backend

  # ─── Grafana (Dashboards & Visualization) ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-fastcase_admin_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 150M
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: fastcase_network
