name: CI Pipeline (Build & Test)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. FastAPI Backend CI ──────────────────────────────────────────────────
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || pip install fastapi uvicorn sqlalchemy psycopg2-binary pydantic-settings python-dotenv pytest; fi
          pip install pytest

      - name: Code Syntax & Import Validation
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-minimum-32-chars-long"
          JWT_SECRET_KEY: "ci-jwt-secret-key-for-testing-purposes-minimum-32-chars"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          cd backend
          python -m py_compile main.py
          python -c "import main; print('FastAPI main compiled successfully')"

      - name: Execute Backend Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-minimum-32-chars-long"
          JWT_SECRET_KEY: "ci-jwt-secret-key-for-testing-purposes-minimum-32-chars"
        run: |
          cd backend
          python -m py_compile app/api/v1/support.py
          python -m py_compile app/services/ticket_emails.py
          echo "✅ Backend syntax verification and critical modules passed."

  # ─── 2. Next.js Main ERP Frontend CI ─────────────────────────────────────────
  frontend-build:
    name: Next.js ERP Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "https://api.fastcase.in/api/v1"
          NEXT_PUBLIC_APP_NAME: "Fastcase"
        run: |
          cd frontend
          npm run build

  # ─── 3. Next.js Admin Frontend CI ───────────────────────────────────────────
  admin-frontend-build:
    name: Admin Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'admin-frontend/package-lock.json'

      - name: Install Admin Dependencies
        run: |
          cd admin-frontend
          npm ci || npm install

      - name: Build Admin Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "https://api.fastcase.in/api/v1"
        run: |
          cd admin-frontend
          npm run build

  # ─── 4. Marketing Website CI ────────────────────────────────────────────────
  website-build:
    name: Marketing Website Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'fastcase-website/package-lock.json'

      - name: Install Website Dependencies
        run: |
          cd fastcase-website
          npm ci || npm install

      - name: Build Website
        run: |
          cd fastcase-website
          npm run build

  # ─── 5. Docker Compose & Config Validation ───────────────────────────────────
  docker-compose-validate:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Compose Files
        run: |
          docker compose -f docker-compose.vps.yml config > /dev/null
          echo "✅ docker-compose.vps.yml is valid and ready for deployment"
