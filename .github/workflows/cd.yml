name: CD Pipeline (Deploy to Production)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Deploy to DigitalOcean Linux VPS ───────────────────────────────────────
  deploy-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 [Fastcase CD] Starting production VPS deployment..."
            
            DEPLOY_DIR="/opt/fastcase"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/High-Cort-ERP"
            fi
            
            echo "📂 Working directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Auto-enable 2GB swap on VPS if not present (prevents Docker OOM crashes on low RAM)
            if [ $(swapon --show | wc -l) -le 1 ]; then
              echo "⚙️ Creating 2GB emergency swap to prevent OOM build crashes..."
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
              if [ -f /swapfile ]; then
                chmod 600 /swapfile
                mkswap /swapfile 2>/dev/null || true
                swapon /swapfile 2>/dev/null || true
                echo "✅ Swap active: $(free -h | grep -i swap)"
              fi
            fi

            echo "📥 Synchronizing latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building updated microservices sequentially for memory safety..."
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.vps.yml build backend
            docker compose -f docker-compose.vps.yml build frontend
            docker compose -f docker-compose.vps.yml build admin-frontend
            docker compose -f docker-compose.vps.yml build website

            echo "🚀 Launching all services with zero-downtime recreation..."
            docker compose -f docker-compose.vps.yml up -d

            echo "🔄 Refreshing Nginx reverse proxy routing..."
            docker compose -f docker-compose.vps.yml restart nginx

            echo "🧹 Pruning dangling Docker layers and images..."
            docker image prune -f

            echo "🩺 Running container health checks..."
            sleep 8
            docker compose -f docker-compose.vps.yml ps

            echo "🌐 Probing FastAPI backend health endpoint..."
            docker compose -f docker-compose.vps.yml exec -T backend python -c "import urllib.request; print('Backend Health Status:', urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).status)" || echo "Notice: Backend still warming up"
            
            echo "✅ [Fastcase CD] Production deployment finished successfully!"
