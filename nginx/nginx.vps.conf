events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # TCP / network performance optimizations
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ── Gzip compression (including proxied upstream responses) ────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        font/otf;

    # ── Rate limiting (50 requests/sec with burst of 100) ──────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    # ── Upstream pools with persistent keepalive connections ───────────────────
    upstream website_upstream {
        server website:80;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 64;
    }

    upstream admin_upstream {
        server admin-frontend:3001;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect for all domains ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge (needed for cert issuance/renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 1. Marketing Website (fastcase.in / www.fastcase.in / landing.fastcase.in) ──
    server {
        listen 443 ssl http2;
        server_name fastcase.in www.fastcase.in landing.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Static assets cache
        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|webp)$ {
            proxy_pass         http://website_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            expires            30d;
            add_header         Cache-Control "public, max-age=2592000";
            access_log         off;
        }

        location / {
            proxy_pass         http://website_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    on;
            proxy_buffers      8 16k;
            proxy_buffer_size  32k;
        }
    }

    # ── 2. Advocate ERP Portal (app.fastcase.in) ──────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API calls proxied to backend
        location /api/ {
            proxy_pass             http://backend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     120s;
            proxy_buffering        on;
            proxy_buffers          8 16k;
            proxy_buffer_size      32k;
        }

        # Next.js static immutable chunks (1 year cache)
        location /_next/static/ {
            proxy_pass             http://frontend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            expires                365d;
            add_header             Cache-Control "public, max-age=31536000, immutable";
            access_log             off;
        }

        # Next.js public assets, fonts, icons, images (30 days cache)
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass             http://frontend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            expires                30d;
            add_header             Cache-Control "public, max-age=2592000";
            access_log             off;
        }

        # Next.js dynamic pages & SSR
        location / {
            proxy_pass             http://frontend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection $http_upgrade;
            proxy_read_timeout     60s;
            proxy_buffering        on;
            proxy_buffers          8 16k;
            proxy_buffer_size      32k;
        }
    }

    # ── 3. Superadmin Portal (admin.fastcase.in) ───────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.fastcase.in superadmin.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass             http://backend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     120s;
            proxy_buffering        on;
            proxy_buffers          8 16k;
            proxy_buffer_size      32k;
        }

        # Next.js static immutable chunks (1 year cache)
        location /_next/static/ {
            proxy_pass             http://admin_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            expires                365d;
            add_header             Cache-Control "public, max-age=31536000, immutable";
            access_log             off;
        }

        # Public assets, fonts, icons, images (30 days cache)
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass             http://admin_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            expires                30d;
            add_header             Cache-Control "public, max-age=2592000";
            access_log             off;
        }

        location / {
            proxy_pass             http://admin_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection $http_upgrade;
            proxy_buffering        on;
            proxy_buffers          8 16k;
            proxy_buffer_size      32k;
        }
    }

    # ── 4. Backend API (api.fastcase.in) ──────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Rate limit API requests with generous burst for dashboard load
        limit_req zone=api burst=100 nodelay;

        location / {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffering    on;
            proxy_buffers      8 16k;
            proxy_buffer_size  32k;
        }
            proxy_read_timeout 120s;
        }
    }
}
