events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_vary     on;
    gzip_types    text/plain text/css application/json application/javascript text/xml image/svg+xml application/xml;
    client_max_body_size 50M;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── HTTP → HTTPS redirect for all domains ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge (needed for cert issuance/renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 1. User Portal (yourdomain.com / www.yourdomain.com / app.yourdomain.com) ──
    server {
        listen 443 ssl http2;
        server_name fastcase.in www.fastcase.in app.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass             http://frontend:3000;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_read_timeout     60s;
        }
    }

    # ── 2. Superadmin Portal (admin.yourdomain.com) ───────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.fastcase.in superadmin.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass             http://admin-frontend:3001;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
        }
    }

    # ── 3. Marketing Landing Site (optional, landing.yourdomain.com) ───────────
    server {
        listen 443 ssl http2;
        server_name landing.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://website:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── 4. Backend API (api.yourdomain.com) ────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Rate limit API requests
        limit_req zone=api burst=20 nodelay;

        location / {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
