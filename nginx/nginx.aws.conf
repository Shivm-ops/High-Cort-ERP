events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # 1. Marketing Website (lagalos.com / www.lagalos.com)
    server {
        listen 80;
        server_name lagalos.com www.lagalos.com;

        location / {
            proxy_pass         http://website:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. ERP Application (app.lagalos.com)
    server {
        listen 80;
        server_name app.lagalos.com;

        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 3. Admin Panel (admin.lagalos.com)
    server {
        listen 80;
        server_name admin.lagalos.com;

        location / {
            proxy_pass         http://admin-frontend:3001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 4. Backend API (api.lagalos.com)
    server {
        listen 80;
        server_name api.lagalos.com;

        location / {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
