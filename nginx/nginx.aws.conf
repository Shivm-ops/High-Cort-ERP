events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Global HTTP to HTTPS Redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 1. Marketing Website (fastcase.in / www.fastcase.in)
    server {
        listen 443 ssl;
        server_name fastcase.in www.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        location / {
            proxy_pass         http://website:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # 2. ERP Application (app.fastcase.in)
    server {
        listen 443 ssl;
        server_name app.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 3. Admin Panel (admin.fastcase.in)
    server {
        listen 443 ssl;
        server_name admin.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        location / {
            proxy_pass         http://admin-frontend:3001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 4. Backend API (api.fastcase.in)
    server {
        listen 443 ssl;
        server_name api.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        location / {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}

