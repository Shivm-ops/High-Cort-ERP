events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Gzip settings
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        font/otf;

    # Global HTTP to HTTPS Redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 1. User Portal (fastcase.in / www.fastcase.in / app.fastcase.in)
    server {
        listen 443 ssl http2;
        server_name fastcase.in www.fastcase.in app.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        # Static chunks
        location /_next/static/ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # Static assets
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            30d;
            add_header         Cache-Control "public, max-age=2592000";
            access_log         off;
        }

        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 2. Superadmin Panel (admin.fastcase.in)
    server {
        listen 443 ssl http2;
        server_name admin.fastcase.in superadmin.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        # Static chunks
        location /_next/static/ {
            proxy_pass         http://admin-frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        # Static assets
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass         http://admin-frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            30d;
            add_header         Cache-Control "public, max-age=2592000";
            access_log         off;
        }

        location / {
            proxy_pass         http://admin-frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # 4. Backend API (api.fastcase.in)
    server {
        listen 443 ssl http2;
        server_name api.fastcase.in;

        ssl_certificate     /etc/letsencrypt/live/fastcase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastcase.in/privkey.pem;

        location / {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
