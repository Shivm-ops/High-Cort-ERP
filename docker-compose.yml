version: "3.9"

services:
  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.fastcase.in/api/v1
        - NEXT_PUBLIC_APP_NAME=Fastcase
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.fastcase.in/api/v1
      - NEXT_PUBLIC_APP_NAME=Fastcase
    depends_on:
      - backend

  # ─── Admin Frontend ────────────────────────────────────────────────────────
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.fastcase.in/api/v1
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.fastcase.in/api/v1
      - PORT=3001
    depends_on:
      - backend

  # ─── Marketing Website ─────────────────────────────────────────────────────
  website:
    build:
      context: ./fastcase-website
      dockerfile: Dockerfile
      args:
        - VITE_ERP_APP_URL=https://app.fastcase.in
    ports:
      - "3000:80"

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.tasks worker --loglevel=info --concurrency=4

  # ─── PostgreSQL (Disabled for RDS Production) ─────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: lagalos_db
  #     POSTGRES_USER: lagalos
  #     POSTGRES_PASSWORD: lagalos_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U lagalos -d lagalos_db"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Elasticsearch ─────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Kibana (Elasticsearch UI) ─────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    profiles:
      - debug

  # ─── ChromaDB (Vector Store) ───────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0

  # ─── MinIO (S3-compatible local storage for dev) ───────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: lagalos_minio
      MINIO_ROOT_PASSWORD: lagalos_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.aws.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - website
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  chromadb_data:
  minio_data:

networks:
  default:
    name: lagalos_network
