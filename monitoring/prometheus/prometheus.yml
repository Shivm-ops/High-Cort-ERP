global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Fastcase REST API Backend (FastAPI instrumentator)
  - job_name: "fastcase-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "fastcase-api"
          environment: "production"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]

